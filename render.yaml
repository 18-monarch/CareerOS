# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Review billing before Apply: API defaults to Free; cron has a $1/month minimum.
# Neon is configured separately. Netlify hosts apps/web using netlify.toml.
envVarGroups:
  - name: careeros-production
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: REGISTRATION_ENABLED
        value: "false"
      - key: AUTO_DISCOVERY_ENABLED
        value: "false"
      - key: AUTO_MIGRATE_LOCAL
        value: "false"
      - key: EXTERNAL_DISCOVERY_ENABLED
        value: "true"
      - key: DISCOVERY_INTERVAL_HOURS
        value: "6"
      - key: DISCOVERY_WORKER_INTERVAL_MINUTES
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.14"
services:
  - type: web
    name: careeros-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: python -m careeros.deploy api
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: careeros-production
  - type: cron
    name: careeros-discovery
    runtime: python
    region: singapore
    plan: starter
    schedule: "15 * * * *"
    buildCommand: pip install -r requirements.lock && pip install --no-deps .
    startCommand: python -m careeros.deploy cron
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: careeros-production
