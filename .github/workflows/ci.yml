name: CareerOS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: careeros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_test
      TEST_DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check apps/api apps/worker && ruff format --check apps/api apps/worker
      - run: pytest -q
      - run: alembic upgrade head && alembic check
      - name: Seed and run workers on migrated PostgreSQL
        env:
          DEMO_PASSWORD: ci-only-test-password-123
        run: |
          python -m careeros.seed
          python -m worker calculate-matches
          python -m worker send-deadline-alerts
          python -m worker send-daily-digest
          python -m worker expire-jobs
  frontend-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run test && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run complete browser workflow
        env:
          DEMO_PASSWORD: CareerOS-local-demo-2026
        run: |
          alembic upgrade head
          python -m careeros.seed
          uvicorn careeros.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          cd apps/web
          npm run start > /tmp/web.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            apps/web/playwright-report
            apps/web/test-results
