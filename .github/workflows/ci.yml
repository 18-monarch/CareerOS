name: CareerOS verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-local:
    runs-on: windows-latest
    env:
      DATABASE_URL: sqlite:///./windows-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m careeros.seed
        env:
          DEMO_PASSWORD: windows-ci-only-12345
      - run: python -m worker run-cycle
      - run: npm ci
        working-directory: apps/web
      - run: npm run test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: careeros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_test
      TEST_DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check apps/api apps/worker scripts/e2e_server.py scripts/check-deployment.py && ruff format --check apps/api apps/worker scripts/e2e_server.py scripts/check-deployment.py
      - run: pytest -q
      - run: alembic upgrade head && alembic check
      - name: Seed and run workers on migrated PostgreSQL
        env:
          DEMO_PASSWORD: ci-only-test-password-123
        run: |
          python -m careeros.seed
          python -m worker calculate-matches
          python -m worker send-deadline-alerts
          python -m worker send-daily-digest
          python -m worker expire-jobs
          python -m worker weekly-summary
          python -m worker refresh-jobs
          python -m worker run-cycle
  frontend-and-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: careeros_browser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros -d careeros_browser"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm run test && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run complete browser workflows against PostgreSQL
        env:
          PYTHON_BIN: python
          E2E_DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_browser
          DEMO_PASSWORD: CareerOS-local-demo-2026
        run: scripts/verify-browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-workflows
          path: apps/web/test-results
      - name: Verify automatic background discovery
        env:
          PYTHON_BIN: python
          E2E_DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_browser
          E2E_AUTODISCOVERY: "true"
          DEMO_PASSWORD: CareerOS-local-demo-2026
        run: scripts/verify-browser.sh discovery.spec.ts
      - name: Verify hosted worker queue controls
        env:
          PYTHON_BIN: python
          E2E_DATABASE_URL: postgresql+psycopg://careeros:test_only@localhost:5432/careeros_browser
          E2E_EXTERNAL_DISCOVERY: "true"
          DEMO_PASSWORD: CareerOS-local-demo-2026
        run: scripts/verify-browser.sh hosted.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            apps/web/playwright-report
            apps/web/test-results

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the full Compose stack
        run: |
          cp .env.example .env
          docker compose --profile app up --build -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/ready && curl -fsS http://localhost:3000 > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/ready
          docker compose exec -T -e DEMO_PASSWORD=container-test-only-123 api python -m careeros.seed
          docker compose exec -T api python -m worker run-cycle
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose --profile app logs --no-color
          docker compose --profile app down -v
